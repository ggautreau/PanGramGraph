<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PanGramGraph">
  <title>PanGramGraph</title>
  <!-- speech bubble = the language model talking; tinted body, model-purple outline, swoosh tail -->
  <path d="M12 2H52A10 10 0 0 1 62 12V36A10 10 0 0 1 52 46H28Q20 57 5 60Q13 53 14 46H12A10 10 0 0 1 2 36V12A10 10 0 0 1 12 2Z" fill="#A292D6" fill-opacity=".13" stroke="#A292D6" stroke-width="4" stroke-linejoin="round"/>
  <!-- the fork of the gene graph: observed branch (grey edge) and the model's predicted branch (purple) -->
  <path d="M24 24C31 24 31 14 38 14" fill="none" stroke="#8296A1" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M24 24C31 24 31 34 38 34" fill="none" stroke="#A292D6" stroke-width="3.5" stroke-linecap="round"/>
  <!-- gene families: persistent (orange) then shell (green) or predicted next gene (purple) -->
  <rect x="8" y="16" width="16" height="16" rx="4" fill="#E0A03A"/>
  <rect x="38" y="8" width="18" height="12" rx="3.5" fill="#37B26A"/>
  <rect x="38" y="28" width="18" height="12" rx="3.5" fill="#A292D6"/>
</svg>
